name: 👕
on:
  push:
    branches: [main]
  pull_request:

jobs:
  dprint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        with:
          dprint-version: '0.60.1' # selfup { "extract": "\\d[^']+", "replacer": ["dprint", "--version"], "nth": 2 }
