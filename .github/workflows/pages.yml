name: 🚀
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/pages.yml'
      - 'public/**'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'public/**'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'public'
  cloudflare:
    if: github.event_name == 'pull_request' && github.actor == github.repository_owner
    needs: [build]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
      pull-requests: write # Required to post comment
    steps:
      - name: Download build assets
        env:
          GH_TOKEN: ${{ github.token }}
        # upload-pages-artifact actually uploading artifacts with special structure. So we can download them
        # See https://github.com/actions/upload-pages-artifact/blob/2d163be3ddce01512f3eea7ac5b7023b5d643ce1/.github/workflows/test-hosted-runners.yml#L37-L45
        run: |
          gh run download '${{ github.run_id }}' --repo '${{ github.repository }}'
          ls -alh
          tree
      - name: Extract the downloaded artifact
        run: |
          mkdir dist
          tar -xf ./github-pages/artifact.tar -C dist
          ls -alh ./dist
          tree ./dist
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # https://developers.cloudflare.com/workers/wrangler/commands/#pages
          # I use branch for relating to PR number. Not actual git branch.
          command: pages deploy dist --project-name=kachick-github-io --branch='${{ github.event.pull_request.number }}'
          gitHubToken: ${{ github.token }}
      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment --repo '${{ github.repository }}' \
            --body "🚀 $DEPLOYMENT_URL" \
            "$PR_NUMBER"
  github:
    needs: [build]
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Allow one concurrent deployment
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - name: Wait other jobs
        uses: kachick/wait-other-jobs@59f25684252050d78317758cbfea7a5f261960cd # v4
        with:
          skip-list: |
            [
              {
                "workflowFile": "merge-bot-pr.yml"
              },
              {
                "workflowFile": "update-flake-lock-and-ci.yml"
              }
            ]
        timeout-minutes: 10
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
